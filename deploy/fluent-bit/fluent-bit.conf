[SERVICE]
    Flush         1
    Daemon        off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224

[FILTER]
    Name          parser
    Match         gophprofile.*
    Key_Name      log
    Parser        slog
    Reserve_Data  On

[OUTPUT]
    Name              opensearch
    Match             gophprofile.*
    Host              opensearch
    Port              9200
    Logstash_Format   On
    Logstash_Prefix   gophprofile-logs
    Suppress_Type_Name On
    Replace_Dots      On
    Retry_Limit       5
