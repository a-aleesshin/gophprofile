[SERVICE]
    Flush                     1
    Daemon                    off
    Log_Level                 info
    Parsers_File              parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    storage.path              /var/lib/fluent-bit/
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 16M

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Mem_Buf_Limit 32M
    storage.type  filesystem

[FILTER]
    Name          parser
    Match         gophprofile.*
    Key_Name      log
    Parser        slog
    Reserve_Data  On

[OUTPUT]
    Name                     opensearch
    Match                    gophprofile.*
    Host                     opensearch
    Port                     9200
    Logstash_Format          On
    Logstash_Prefix          gophprofile-logs
    Suppress_Type_Name       On
    Replace_Dots             On
    Retry_Limit              5
    storage.total_limit_size 256M
