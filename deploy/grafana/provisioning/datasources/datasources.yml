apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 10s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686

  - name: OpenSearch
    type: grafana-opensearch-datasource
    uid: opensearch
    access: proxy
    url: http://opensearch:9200
    jsonData:
      database: gophprofile-logs-*
      flavor: opensearch
      version: 2.19.0
      timeField: "@timestamp"
      logMessageField: msg
      logLevelField: level
      pplEnabled: true
      dataLinks:
        - field: trace_id
          datasourceUid: jaeger
          url: "${__value.raw}"
