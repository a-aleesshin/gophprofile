defaultRules:
  create: false
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
grafana:
  adminPassword: admin
  additionalDataSources:
    - name: Jaeger
      type: jaeger
      uid: jaeger
      access: proxy
      url: http://jaeger.monitoring:16686
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.monitoring:3100
      jsonData:
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":"([a-f0-9]+)"'
            url: '${__value.raw}'
            datasourceUid: jaeger
  persistence:
    enabled: false
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth:
      disable_login_form: false
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
