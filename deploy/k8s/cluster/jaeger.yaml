apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: query
      port: 16686
      targetPort: query
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      initContainers:
        - name: storage-permissions
          image: alpine:3.21
          command:
            - sh
            - -c
            - mkdir -p /var/lib/jaeger/keys /var/lib/jaeger/values && chown -R 10001:10001 /var/lib/jaeger
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: storage
              mountPath: /var/lib/jaeger
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.12.0
          args: ["--config=file:/etc/jaeger/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: query
              containerPort: 16686
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /status
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /status
              port: health
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            - name: storage
              mountPath: /var/lib/jaeger
      volumes:
        - name: config
          configMap:
            name: jaeger-config
        - name: storage
          persistentVolumeClaim:
            claimName: jaeger
