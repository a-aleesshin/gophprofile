{{- range $service, $spec := .Values.services }}
{{- if not $spec.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.secretName" (dict "root" $ "service" $service "spec" $spec) }}
  labels:
    {{- include "gophprofile.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $service }}
type: Opaque
stringData:
  {{- range $key, $value := $spec.secretEnv }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
