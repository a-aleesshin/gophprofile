nameOverride: ""
fullnameOverride: ""

image:
  registry: ""
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop: ["ALL"]

terminationGracePeriodSeconds: 30

preStopDelaySeconds: 5

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60

services:
  file:
    repository: gophprofile/file
    migrate: true
    env:
      LOG_LEVEL: info
      LOG_FORMAT: json
      S3_ENDPOINT: minio:9000
      S3_BUCKET: gophprofile
      S3_PUBLIC_BASE: ""
      POLICIES_PATH: configs/policies.yaml
      LINK_PUBLIC_BASE: ""
      TRACING_ENABLED: "false"
      TRACING_ENDPOINT: ""
      TRACING_SAMPLE_RATIO: "1"
    existingSecret: ""
    secretEnv:
      POSTGRES_DSN: ""
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      RABBIT_URL: ""
      LINK_SECRET: ""
      LINK_PREVIOUS_SECRET: ""
      GRPC_TOKEN: ""
  profile:
    repository: gophprofile/profile
    migrate: true
    env:
      LOG_LEVEL: info
      LOG_FORMAT: json
      CONTENT_PUBLIC_BASE: ""
      CONTENT_PLACEHOLDER: ""
      POLICY_MAX_SIZE_BYTES: "10485760"
      POLICY_ALLOWED_MIME: image/jpeg,image/png,image/webp
      POLICY_MAX_AVATARS_PER_USER: "20"
      IDENTITY_DEMO_LOGIN: "false"
      TRACING_ENABLED: "false"
      TRACING_ENDPOINT: ""
      TRACING_SAMPLE_RATIO: "1"
    existingSecret: ""
    secretEnv:
      POSTGRES_DSN: ""
      FILE_TOKEN: ""
      IDENTITY_SECRET: ""
      IDENTITY_LOGIN_SECRET: ""
      IDENTITY_PREVIOUS_SECRET: ""

workloads:
  file-server:
    service: file
    command: server
    replicas: 1
    headless: false
    ports:
      http: 8080
      grpc: 9090
      health: 8081
      metrics: 9100
    env: {}
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationSeconds: 300
    disruptionBudget:
      enabled: false
      maxUnavailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  file-worker:
    service: file
    command: worker
    replicas: 1
    headless: true
    ports:
      health: 8081
      metrics: 9100
    env:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: gophprofile.profile.v1
      KAFKA_GROUP: file
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 512Mi
  profile-server:
    service: profile
    command: server
    replicas: 1
    headless: false
    ports:
      http: 8080
      health: 8081
      metrics: 9100
    env: {}
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationSeconds: 300
    disruptionBudget:
      enabled: false
      maxUnavailable: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  profile-worker:
    service: profile
    command: worker
    replicas: 1
    headless: true
    ports:
      health: 8081
      metrics: 9100
    env:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: gophprofile.file.v1
      KAFKA_GROUP: profile
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

web:
  enabled: true
  repository: gophprofile/web
  replicas: 1
  port: 8080
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

ingress:
  enabled: true
  className: nginx
  host: ""
  tls:
    enabled: false
    secretName: ""
  routes:
    api:
      annotations:
        nginx.ingress.kubernetes.io/limit-rps: "10"
        nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
        nginx.ingress.kubernetes.io/proxy-body-size: 1m
      paths:
        - path: /api/v1/
          pathType: Prefix
          component: profile-server
          port: http
    content:
      annotations:
        nginx.ingress.kubernetes.io/limit-rps: "30"
        nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
        nginx.ingress.kubernetes.io/proxy-body-size: 1m
      paths:
        - path: /upload/
          pathType: Prefix
          component: file-server
          port: http
    console:
      annotations:
        nginx.ingress.kubernetes.io/app-root: /static/index.html
        nginx.ingress.kubernetes.io/limit-rps: "30"
        nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
      paths:
        - path: /static/
          pathType: Prefix
          component: web
          port: http
    storage:
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /gophprofile/
        nginx.ingress.kubernetes.io/proxy-body-size: 55m
        nginx.ingress.kubernetes.io/limit-rps: "10"
        nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
      paths:
        - path: /s3/gophprofile/
          pathType: Exact
          service: minio
          port: 9000

networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring
  depsSelector:
    app.kubernetes.io/part-of: gophprofile-deps
  depsPorts: [5432, 9000, 9092, 5672]
  probeCIDRs: []
  tracing:
    enabled: false
    namespace: monitoring
    port: 4317
  extraEgress: []

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true
  dashboards:
    enabled: true
    label: grafana_dashboard
