image:
  pullPolicy: IfNotPresent

services:
  file:
    env:
      S3_PUBLIC_BASE: http://localhost:8080/s3
      LINK_PUBLIC_BASE: http://localhost:8080
      TRACING_ENABLED: "true"
      TRACING_ENDPOINT: jaeger.monitoring:4317
    secretEnv:
      POSTGRES_DSN: postgres://file:file@file-db:5432/file?sslmode=disable
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      RABBIT_URL: amqp://guest:guest@rabbitmq:5672/
  profile:
    env:
      CONTENT_PUBLIC_BASE: http://localhost:8080
      CONTENT_PLACEHOLDER: http://localhost:8080/static/placeholder.svg
      IDENTITY_DEMO_LOGIN: "true"
      TRACING_ENABLED: "true"
      TRACING_ENDPOINT: jaeger.monitoring:4317
    secretEnv:
      POSTGRES_DSN: postgres://profile:profile@profile-db:5432/profile?sslmode=disable

workloads:
  file-server:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationSeconds: 60
  profile-server:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70
      scaleDownStabilizationSeconds: 60

networkPolicy:
  tracing:
    enabled: true
