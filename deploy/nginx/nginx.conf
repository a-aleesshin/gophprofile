worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    server_tokens off;

    limit_req_zone $binary_remote_addr zone=content:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    proxy_cache_path /var/cache/nginx/content levels=1:2 keys_zone=content_cache:64m
                     max_size=1g inactive=7d use_temp_path=off;

    map $arg_sig $signed_request {
        default 1;
        ""      0;
    }

    upstream file_http {
        server file-server:8080;
    }

    upstream profile_http {
        server profile-server:8080;
    }

    upstream minio_s3 {
        server minio:9000;
    }

    server {
        listen 80;

        absolute_redirect off;

        client_max_body_size 1m;

        location /upload/ {
            limit_req zone=content burst=60 nodelay;

            proxy_cache content_cache;
            proxy_cache_key "$uri";
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating;
            proxy_cache_lock on;
            proxy_no_cache $signed_request;
            proxy_cache_bypass $signed_request;
            add_header X-Cache-Status $upstream_cache_status;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://file_http;
        }

        location /api/v1/ {
            limit_req zone=api burst=20 nodelay;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://profile_http;
        }

        location = /static/placeholder.svg {
            limit_req zone=content burst=60 nodelay;

            default_type image/svg+xml;
            add_header Cache-Control "public, max-age=86400";

            return 200 '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300"><rect width="300" height="300" fill="#e4e6eb"/><circle cx="150" cy="115" r="52" fill="#b0b4bb"/><path d="M40 300c0-60 49-96 110-96s110 36 110 96z" fill="#b0b4bb"/></svg>';
        }

        location = /s3/gophprofile/ {
            limit_except POST {
                deny all;
            }

            limit_req zone=api burst=20 nodelay;

            client_max_body_size 55m;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://minio_s3/gophprofile/;
        }

        location /s3/ {
            return 404;
        }

        location /static/ {
            limit_req zone=content burst=60 nodelay;

            root /var/www;
            try_files $uri $uri/ =404;
        }

        location = / {
            return 302 /static/index.html;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }
}
