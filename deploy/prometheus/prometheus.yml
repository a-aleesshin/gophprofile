global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: gophprofile
    static_configs:
      - targets:
          - file-server:9100
          - file-worker:9100
        labels:
          service: file
      - targets:
          - profile-server:9100
          - profile-worker:9100
        labels:
          service: profile
