namespaces:
  avatar:
    access: public
    validator: image
    upload_ttl: 15m
    max_size_bytes: 10485760
    content_type_prefix: "image/"
    allowed_mime:
      - image/jpeg
      - image/png
      - image/webp
    max_pixels: 50000000
    max_dimension: 10000
    min_dimension: 100
    cache_control: "public, max-age=31536000, immutable"
    disposition: inline
    accept_ranges: false
    variants:
      - name: 100x100
        width: 100
        height: 100
        fit: cover
        format: webp
        quality: 82
      - name: 300x300
        width: 300
        height: 300
        fit: cover
        format: webp
        quality: 82
      - name: web
        width: 800
        height: 800
        fit: inside
        format: webp
        quality: 85

  document:
    access: signed
    validator: container
    link_max_ttl: 15m
    upload_ttl: 30m
    max_size_bytes: 52428800
    content_type_prefix: "application/"
    allowed_mime:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    zip_max_entries: 1000
    zip_max_entry_bytes: 104857600
    zip_max_total_bytes: 524288000
    zip_max_ratio: 20
    cache_control: "private, no-store"
    disposition: attachment
    accept_ranges: true
    variants: []
