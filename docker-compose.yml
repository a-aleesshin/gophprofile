name: gophprofile

x-file-env: &file-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  POSTGRES_DSN: postgres://file:file@postgres:5432/file?sslmode=disable
  S3_ENDPOINT: minio:9000
  S3_PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:8000}/s3
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: gophprofile
  POLICIES_PATH: configs/policies.yaml

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: file
      POSTGRES_USER: file
      POSTGRES_PASSWORD: file
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file -d file"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 \
          ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/gophprofile &&
        mc anonymous set none local/gophprofile
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic gophprofile.file.v1 \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic gophprofile.profile.v1 \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000
    restart: "no"

  file-migrate:
    build:
      context: .
    image: gophprofile/file:dev
    entrypoint: ["migrate"]
    environment: *file-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  file-server:
    build:
      context: .
    image: gophprofile/file:dev
    restart: unless-stopped
    entrypoint: ["server"]
    environment:
      <<: *file-env
      GRPC_ADDR: ":9090"
      HTTP_ADDR: ":8080"
      HEALTH_ADDR: ":8081"
      METRICS_ADDR: ":9100"
      PPROF_ADDR: ":6060"
      LINK_PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:8000}
      LINK_SECRET: ${LINK_SECRET:?set LINK_SECRET to at least 32 bytes}
      LINK_PREVIOUS_SECRET: ${LINK_PREVIOUS_SECRET:-}
    depends_on:
      file-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  file-worker:
    build:
      context: .
    image: gophprofile/file:dev
    restart: unless-stopped
    entrypoint: ["worker"]
    environment:
      <<: *file-env
      HEALTH_ADDR: ":8081"
      METRICS_ADDR: ":9100"
      PPROF_ADDR: ":6060"
      RABBIT_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: gophprofile.file.v1
      KAFKA_GROUP: file
    depends_on:
      file-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      file-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres:
  minio:
  rabbitmq:
  kafka:
  nginx-cache:
