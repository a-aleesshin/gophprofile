name: gophprofile

x-file-env: &file-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  POSTGRES_DSN: postgres://file:file@file-db:5432/file?sslmode=disable
  S3_ENDPOINT: minio:9000
  S3_PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:8000}/s3
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: gophprofile
  POLICIES_PATH: configs/policies.yaml
  TRACING_ENABLED: ${TRACING_ENABLED:-true}
  TRACING_ENDPOINT: ${TRACING_ENDPOINT:-jaeger:4317}
  TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1}

x-profile-env: &profile-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  POSTGRES_DSN: postgres://profile:profile@profile-db:5432/profile?sslmode=disable
  FILE_ADDR: file-server:9090
  FILE_TOKEN: ${GRPC_TOKEN:?set GRPC_TOKEN to at least 32 bytes}
  CONTENT_PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:8000}
  CONTENT_PLACEHOLDER: ${PUBLIC_BASE:-http://localhost:8000}/static/placeholder.svg
  POLICY_MAX_SIZE_BYTES: ${POLICY_MAX_SIZE_BYTES:-10485760}
  POLICY_ALLOWED_MIME: ${POLICY_ALLOWED_MIME:-image/jpeg,image/png,image/webp}
  POLICY_MAX_AVATARS_PER_USER: ${POLICY_MAX_AVATARS_PER_USER:-20}
  HEALTH_ADDR: ":8081"
  METRICS_ADDR: ":9100"
  PPROF_ADDR: ${PPROF_ADDR:-}
  TRACING_ENABLED: ${TRACING_ENABLED:-true}
  TRACING_ENDPOINT: ${TRACING_ENDPOINT:-jaeger:4317}
  TRACING_SAMPLE_RATIO: ${TRACING_SAMPLE_RATIO:-1}

services:
  file-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: file
      POSTGRES_USER: file
      POSTGRES_PASSWORD: file
    volumes:
      - file-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file -d file"]
      interval: 3s
      timeout: 3s
      retries: 20

  profile-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profile
      POSTGRES_USER: profile
      POSTGRES_PASSWORD: profile
    volumes:
      - profile-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profile -d profile"]
      interval: 3s
      timeout: 3s
      retries: 20

  fluent-bit:
    image: fluent/fluent-bit:3.2.10
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ./deploy/fluent-bit:/fluent-bit/etc:ro
      - fluent-bit:/var/lib/fluent-bit
    ports:
      - "${FLUENT_BIT_PORT:-24224}:24224"
    healthcheck:
      test: ["CMD", "/fluent-bit/bin/fluent-bit", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.0
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 40

  opensearch-init:
    image: curlimages/curl:8.11.1
    depends_on:
      opensearch-dashboards:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        curl -sS -X POST \
          http://opensearch-dashboards:5601/api/saved_objects/index-pattern/gophprofile-logs \
          -H 'osd-xsrf: true' -H 'Content-Type: application/json' \
          -d '{"attributes":{"title":"gophprofile-logs-*","timeFieldName":"@timestamp"}}' \
          || echo "index pattern already exists"
    restart: "no"

  grafana:
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_INSTALL_PLUGINS: grafana-opensearch-datasource
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - alertmanager:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/jaeger:2.12.0
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_PORT:-4317}:4317"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 \
          ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        mc mb --ignore-existing local/gophprofile &&
        mc anonymous set none local/gophprofile
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic gophprofile.file.v1 \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic gophprofile.profile.v1 \
          --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000
    restart: "no"

  file-migrate:
    build:
      context: .
      dockerfile: deploy/file.Dockerfile
    image: gophprofile/file:dev
    entrypoint: ["migrate"]
    environment: *file-env
    depends_on:
      file-db:
        condition: service_healthy
    restart: "no"

  file-server:
    build:
      context: .
      dockerfile: deploy/file.Dockerfile
    image: gophprofile/file:dev
    restart: unless-stopped
    entrypoint: ["server"]
    environment:
      <<: *file-env
      GRPC_ADDR: ":9090"
      HTTP_ADDR: ":8080"
      HEALTH_ADDR: ":8081"
      METRICS_ADDR: ":9100"
      PPROF_ADDR: ${PPROF_ADDR:-}
      LINK_PUBLIC_BASE: ${PUBLIC_BASE:-http://localhost:8000}
      LINK_SECRET: ${LINK_SECRET:?set LINK_SECRET to at least 32 bytes}
      GRPC_TOKEN: ${GRPC_TOKEN:?set GRPC_TOKEN to at least 32 bytes}
      LINK_PREVIOUS_SECRET: ${LINK_PREVIOUS_SECRET:-}
    depends_on:
      file-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

    logging:
      driver: fluentd
      options:
        fluentd-address: ${FLUENTD_ADDRESS:-localhost:24224}
        fluentd-async: "true"
        tag: gophprofile.{{.Name}}
  file-worker:
    build:
      context: .
      dockerfile: deploy/file.Dockerfile
    image: gophprofile/file:dev
    restart: unless-stopped
    entrypoint: ["worker"]
    environment:
      <<: *file-env
      HEALTH_ADDR: ":8081"
      METRICS_ADDR: ":9100"
      PPROF_ADDR: ${PPROF_ADDR:-}
      RABBIT_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: gophprofile.profile.v1
      KAFKA_GROUP: file
    depends_on:
      file-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

    logging:
      driver: fluentd
      options:
        fluentd-address: ${FLUENTD_ADDRESS:-localhost:24224}
        fluentd-async: "true"
        tag: gophprofile.{{.Name}}
  profile-migrate:
    build:
      context: .
      dockerfile: deploy/profile.Dockerfile
    image: gophprofile/profile:dev
    entrypoint: ["migrate"]
    environment: *profile-env
    depends_on:
      profile-db:
        condition: service_healthy
    restart: "no"

  profile-server:
    build:
      context: .
      dockerfile: deploy/profile.Dockerfile
    image: gophprofile/profile:dev
    restart: unless-stopped
    entrypoint: ["server"]
    environment:
      <<: *profile-env
      HTTP_ADDR: ":8080"
      IDENTITY_SECRET: ${IDENTITY_SECRET:?set IDENTITY_SECRET to at least 32 bytes}
      IDENTITY_DEMO_LOGIN: ${IDENTITY_DEMO_LOGIN:-false}
      IDENTITY_LOGIN_SECRET: ${IDENTITY_LOGIN_SECRET:-}
      IDENTITY_PREVIOUS_SECRET: ${IDENTITY_PREVIOUS_SECRET:-}
    depends_on:
      profile-migrate:
        condition: service_completed_successfully
      file-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

    logging:
      driver: fluentd
      options:
        fluentd-address: ${FLUENTD_ADDRESS:-localhost:24224}
        fluentd-async: "true"
        tag: gophprofile.{{.Name}}
  profile-worker:
    build:
      context: .
      dockerfile: deploy/profile.Dockerfile
    image: gophprofile/profile:dev
    restart: unless-stopped
    entrypoint: ["worker"]
    environment:
      <<: *profile-env
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: gophprofile.file.v1
      KAFKA_GROUP: profile
    depends_on:
      profile-migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

    logging:
      driver: fluentd
      options:
        fluentd-address: ${FLUENTD_ADDRESS:-localhost:24224}
        fluentd-async: "true"
        tag: gophprofile.{{.Name}}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web:/var/www:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      file-server:
        condition: service_healthy
      profile-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: fluentd
      options:
        fluentd-address: ${FLUENTD_ADDRESS:-localhost:24224}
        fluentd-async: "true"
        tag: gophprofile.{{.Name}}

volumes:
  alertmanager:
  fluent-bit:
  opensearch:
  grafana:
  prometheus:
  file-db:
  profile-db:
  minio:
  rabbitmq:
  kafka:
  nginx-cache:
